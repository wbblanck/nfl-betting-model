[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-betting-model"
version = "0.1.0"
description = "NFL player-prop research: pre-registered tests against Action Network lines."
requires-python = ">=3.11"
dependencies = [
    "openpyxl", "pyyaml>=6", "polars>=1.0", "pyarrow>=15", "numpy>=1.26", "nflreadpy>=0.1.5", "xgboost>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
