name: ATS live probe
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/ats_live_probe.py', '.github/workflows/ats-live-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install polars
      - run: python scripts/audit/ats_live_probe.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          OPENMARKETS_API_KEY: ${{ secrets.OPENMARKETS_API_KEY }}
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/ats_live || exit 0
          git commit -m "evidence: ATS live sources probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
