name: Kalshi probe
# Read-only: Kalshi's public API vs OpenMarkets' Kalshi prices (scripts/audit/kalshi_probe.py). No Kalshi key.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/kalshi_probe.py', '.github/workflows/kalshi-probe.yml']
permissions:
  contents: write
concurrency:
  group: kalshi-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Probe Kalshi
        run: python scripts/audit/kalshi_probe.py
        env:
          OPENMARKETS_API_KEY: ${{ secrets.OPENMARKETS_API_KEY }}
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/kalshi_probe || true
          git commit -m "evidence: Kalshi probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((2**i)); done
          exit 1
