name: ESPN snapshot
# Injuries + depth charts (current state). Scheduled runs fire from main only.
on:
  schedule:
    - cron: '7 16 * * 6'    # Saturday, after Friday's final injury reports
    - cron: '7 15 * * 0'    # Sunday morning, before the early games
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/fetch/espn_snapshot.py', '.github/workflows/espn-snapshot.yml']
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fetch/espn_snapshot.py
      - name: Commit
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add data/espn/snapshots || exit 0
          git commit -m "espn: injuries/depth snapshot" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
