name: Delete one leaked run log
# One-off, approved by Will 2026-11-19: delete SportsGameOdds probe run 44583345933, whose log printed an account email.
on:
  push:
    branches: [claude/project-thread-07ra4r]
    paths: ['.github/workflows/delete-run-once.yml']
permissions:
  actions: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/44583345933/logs" || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/44583345933"
          echo "deleted"
