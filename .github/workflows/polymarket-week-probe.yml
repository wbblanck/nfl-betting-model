name: Polymarket week probe
# Read-only diagnostic: why the week search misses this week's NFL games (scripts/audit/polymarket_week_probe.py).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/polymarket_week_probe.py', '.github/workflows/polymarket-week-probe.yml']
permissions:
  contents: write
concurrency:
  group: polymarket-week-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Diagnose the Polymarket week search
        run: python scripts/audit/polymarket_week_probe.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/polymarket_week_probe || true
          git commit -m "evidence: Polymarket week probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((2**i)); done
          exit 1
