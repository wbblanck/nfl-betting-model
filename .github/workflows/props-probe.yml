name: Props probe
# Evidence only: which historical NFL player-prop lines Action Network holds.
# Commits docs/evidence/props/<UTC stamp>/.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/props_probe.py', '.github/workflows/props-probe.yml']

permissions:
  contents: write

concurrency:
  group: props-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: python scripts/audit/props_probe.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/props || exit 0
          git commit -m "audit: props probe evidence" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
