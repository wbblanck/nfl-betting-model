name: S1 live
# Rule S1 live (docs/s1_live_rules.md): record picks before each game window; grade on Tuesdays.
# Times are UTC and chosen to stay before kickoff in both EDT and EST. Scheduled runs fire from main only and can
# start late; every run scores all games of the week that have not started, so an earlier run is the fallback.
on:
  schedule:
    # Earlier backups (added 2026-10-07): GitHub starts scheduled runs up to ~4 h late, so each window has a run ~3 h
    # ahead of the main one. A run is cheap and idempotent; each game's official pick is the last run before kickoff.
    - cron: '0 16 * * 4'     # Thursday, early (TNF)
    - cron: '0 10 * * 6'     # Saturday, early
    - cron: '30 9 * * 0'     # Sunday, early (London games)
    - cron: '50 12 * * 0'    # Sunday, early (1 PM ET games)
    - cron: '0 16 * * 0'     # Sunday, early (4 PM ET games)
    - cron: '45 19 * * 0'    # Sunday, early (SNF)
    - cron: '0 17 * * 1'     # Monday, early (MNF)
    - cron: '0 20 * * 4'     # Thursday, before TNF
    - cron: '0 14 * * 6'     # Saturday morning (late-season Saturday games)
    - cron: '30 12 * * 0'    # Sunday, before London games
    - cron: '50 15 * * 0'    # Sunday, before 1 PM ET
    - cron: '0 19 * * 0'     # Sunday, before 4 PM ET
    - cron: '45 22 * * 0'    # Sunday, before SNF
    - cron: '0 21 * * 1'     # Monday, before MNF
    - cron: '7 14 * * 1'     # Monday morning: grade Sunday's games
    - cron: '33 15 * * 2'    # Tuesday: grade
    - cron: '7 14 * * 3'     # Wednesday: grade Monday night
  workflow_dispatch:
    inputs:
      step:
        description: "run or grade"
        required: true
        default: "run"
permissions:
  contents: write
concurrency:
  group: live-s1
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Pick or grade
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}   # second price record only; S1 runs on Action Network
          OPENMARKETS_API_KEY: ${{ secrets.OPENMARKETS_API_KEY }}   # third price record (prediction markets); read-only
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then STEP="${{ github.event.inputs.step }}";
          else case "${{ github.event.schedule }}" in "7 14 * * 1"|"33 15 * * 2"|"7 14 * * 3") STEP=grade;; *) STEP=run;; esac; fi
          python scripts/live_s1.py "$STEP"
          [ "$STEP" = run ] && python scripts/live_s1.py grade || true
      - name: Weekly recap
        if: always() && (github.event.schedule == '33 15 * * 2' || github.event.schedule == '7 14 * * 3' || github.event.inputs.step == 'grade')
        continue-on-error: true
        run: python scripts/recap.py
      - name: Dashboard page
        if: always()
        continue-on-error: true
        run: python scripts/dashboard.py
      - name: Commit
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          for f in data/live/s1_picks_2026.csv data/live/s1_runs_2026.csv data/live/s1_record_2026.csv data/live/s1pa_picks_2026.csv data/live/s1pa_runs_2026.csv data/live/s1pa_record_2026.csv docs/s1_live.md docs/s1_dashboard.html; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d data/live/lines ] && git add data/live/lines
          [ -d data/live/injuries ] && git add data/live/injuries
          [ -d data/live/depth ] && git add data/live/depth
          [ -d data/live/parlay ] && git add data/live/parlay
          [ -d data/live/openmarkets ] && git add data/live/openmarkets
          [ -f data/live/openmarkets_compare_2026.csv ] && git add data/live/openmarkets_compare_2026.csv
          [ -f data/live/parlay_compare_2026.csv ] && git add data/live/parlay_compare_2026.csv
          [ -d docs/recaps ] && git add docs/recaps
          [ -f data/live/recap_ledger_2026.csv ] && git add data/live/recap_ledger_2026.csv
          git commit -m "S1 live: ${{ github.event.schedule || github.event.inputs.step }}" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
