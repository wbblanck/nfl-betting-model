name: EndzoneAPI price check
# Evidence only: estimate_only prices for prop-call variants (free; stops if anything is charged).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/endzone_estimates.py', '.github/workflows/endzone-estimates.yml']
permissions:
  contents: write
concurrency:
  group: endzone-estimates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit/endzone_estimates.py
        env:
          ENDZONEAPI_API_KEY: ${{ secrets.ENDZONEAPI_API_KEY }}
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/endzone_estimates || exit 0
          git commit -m "evidence: EndzoneAPI price check" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
