name: ParlayAPI probe
# Evidence only: NFL player props on ParlayAPI (markets, books, two-sided prices). One props call = 3 credits.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/parlay_probe.py', '.github/workflows/parlay-probe.yml']
permissions:
  contents: write
concurrency:
  group: parlay-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit/parlay_probe.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          # S1 markets only, DraftKings + FanDuel (keys as each book files them in the 2026-10-08 unfiltered dump)
          PARLAY_BOOKS: draftkings,fanduel
          PARLAY_MARKETS: player_passing_yards,player_passing_attempts,player_passing_completions,player_rushing_yards,player_rushing_attempts,player_receiving_yards,player_receptions,player_passing_+_rushing_yards,player_rushing_+_receiving_yards,player_pass_yds,player_rec_yds,player_rush_yds,player_rush_reception_yds,player_pass_attempts,player_pass_completions,player_rush_attempts
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/parlay || exit 0
          git commit -m "evidence: ParlayAPI NFL props probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
