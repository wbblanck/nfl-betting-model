name: Polymarket book probe
# Read-only: check the order book and BBO endpoints (scripts/audit/polymarket_book_probe.py).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/polymarket_book_probe.py', '.github/workflows/polymarket-book-probe.yml']
permissions:
  contents: write
concurrency:
  group: polymarket-book-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe the Polymarket US book and BBO
        run: python scripts/audit/polymarket_book_probe.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/polymarket_book_probe || true
          git commit -m "evidence: Polymarket book probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((2**i)); done
          exit 1
