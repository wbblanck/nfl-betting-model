name: Sharp coverage snapshot
# Weekly dated copy of Sharp Football's free team coverage page (scripts/fetch/sharp_coverage.py).
# Tuesday after Monday night; scheduled runs only fire from main.
on:
  schedule:
    - cron: '23 16 * * 2'
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/fetch/sharp_coverage.py', '.github/workflows/sharp-coverage.yml']
permissions:
  contents: write
concurrency:
  group: sharp-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snap:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge ')   # merges re-touch watched paths: skip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/fetch/sharp_coverage.py
      - name: Commit
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add data/live/sharp_coverage || exit 0
          git commit -m "sharp: coverage snapshot" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
