name: Engine paper preview
# Pre-game view of the engine paper fills (docs/engine/paper_rules.md, "Pre-game view"): after each Novig recorder
# run, each frozen engine's sides with a 0.03+ edge against the latest recorded book, labeled provisional. Paper only,
# places nothing. The official fills are computed after the week by the Engine Test M job.
on:
  workflow_run:
    workflows: ["Novig books"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engine-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The frozen records were made with these versions; others can move the fitted numbers and the run refuses.
      - run: pip install -e . "polars==2.1.0" "numpy==2.5.3" "scipy==1.18.1" "xgboost==3.4.1" "nflreadpy==0.1.5" "pyarrow==26.0.1"
      - uses: actions/cache@v4
        with:
          path: data/cache/engine
          key: engine-warehouse-2010-2025-v1
      - name: Warehouse
        run: python scripts/engine_ingest.py 2010-2025 | tail -1
      - name: Preview
        run: PYTHONPATH=scripts python scripts/engine_preview.py
      - name: Commit
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add data/live/engine_paper || exit 0
          git commit -m "engine paper: pre-game view" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((2**i)); done
