name: Novig books
# Record Novig's NFL player-prop and game-line books (scripts/fetch/novig_books.py; docs/engine/NOVIG_INTEGRATION.md).
# Read-only public catalog, no key, places nothing. Every run saves the catalog with top of book; games starting
# within 6 hours also get full-depth books. Times are UTC. Scheduled runs fire from main only and can start late.
on:
  schedule:
    # GitHub starts scheduled runs late: on 2026-11-12 the two Thursday runs set for 21:40 and 23:10 UTC started at
    # 02:08 and 03:23, after kickoff, and saved no books. So each game window has two runs, about 6 h and 3.5 h
    # before kickoff, and books are pulled for games starting within 6 hours: the early run still lands before
    # kickoff when it is 4.5 h late. Kickoffs below are for Eastern Standard Time (UTC-5).
    - cron: '20 15 * * 3'    # Wednesday: early-week catalog
    - cron: '20 15 * * 5'    # Friday: catalog after most injury reports
    - cron: '15 19 * * 4'    # Thursday night game (01:15 UTC Friday), early
    - cron: '45 21 * * 4'    # Thursday night game, late
    - cron: '0 12 * * 0'     # Sunday 1 PM ET games (18:00 UTC), early
    - cron: '30 14 * * 0'    # Sunday 1 PM ET games, late
    - cron: '10 15 * * 0'    # Sunday 4 PM ET games (21:05 / 21:25 UTC), early
    - cron: '40 17 * * 0'    # Sunday 4 PM ET games, late
    - cron: '20 19 * * 0'    # Sunday night game (01:20 UTC Monday), early
    - cron: '50 21 * * 0'    # Sunday night game, late
    - cron: '15 19 * * 1'    # Monday night game (01:15 UTC Tuesday), early
    - cron: '45 21 * * 1'    # Monday night game, late
    - cron: '20 15 * * 6'    # Saturday (late-season Saturday games)
  workflow_dispatch:
    inputs:
      hours:
        description: "full-depth books for games starting within this many hours"
        required: true
        default: "6"
  push:
    branches-ignore: [main]
    paths: ['scripts/fetch/novig_books.py', 'src/nflbet/engine/novig_capture.py', '.github/workflows/novig-books.yml']
permissions:
  contents: write
concurrency:
  group: novig-books
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Record Novig books
        env:
          HOURS: ${{ github.event.inputs.hours || '6' }}
        run: python scripts/fetch/novig_books.py --hours "$HOURS"
      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add data/live/novig_books || true
          git commit -m "novig books: snapshot" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((2**i)); done
          exit 1
