name: Action Network props probe
# Evidence only: Action Network props response shape (keyless).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/an_props_probe.py', '.github/workflows/an-props-probe.yml']
permissions:
  contents: write
concurrency:
  group: an-props-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/audit/an_props_probe.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/an_props_probe || exit 0
          git commit -m "evidence: Action Network props probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
