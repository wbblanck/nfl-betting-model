name: ESPN probe
# Evidence only: which ESPN endpoints answer from a runner, and whether core odds carry player props.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/audit/espn_probe.py', 'scripts/audit/espn_props_full.py', 'scripts/audit/espn_api_scan.py', '.github/workflows/espn-probe.yml']
permissions:
  contents: write
concurrency:
  group: espn-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit/espn_probe.py
      - name: Full propBets dump
        if: always()
        run: python scripts/audit/espn_props_full.py
      - name: Endpoint scan (pseudo-r/Public-ESPN-API list)
        if: always()
        run: python scripts/audit/espn_api_scan.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "nfl-betting-model"
          git config user.email "nfl-betting-model@users.noreply.github.com"
          git add docs/evidence/espn || exit 0
          git add docs/evidence/espn_props || true
          git add docs/evidence/espn_scan || true
          git commit -m "evidence: ESPN API probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
